<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8f4">
<meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
<meta name="description" content="爻象AI命理大师——周易六爻、八字命理、紫微斗数、梅花易数、称骨算命、塔罗占卜、姓名分析、生肖运势，AI驱动的传统命理学工具">
<title>爻象 · AI命理大师</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 顶部状态栏 -->
  <header id="app-header">
    <div class="header-brand">
      <span class="brand-icon">☰</span>
      <h1>爻 象</h1>
    </div>
    <div class="header-actions">
      <button id="btn-theme" class="icon-btn" title="切换主题">🌓</button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main id="app-main">
    <!-- 首页 -->
    <section id="page-home" class="page active">
      <div class="hero">
        <div class="hero-bagua" id="hero-bagua"></div>
        <h2>以爻象观天机</h2>
        <p>周易·八字·紫微·梅花·六爻·塔罗</p>
      </div>
      <div class="quick-actions" id="quick-actions"></div>
      <div class="daily-card" id="daily-card"></div>
      <div class="feature-grid" id="feature-grid"></div>
    </section>

    <!-- 六爻占卜 -->
    <section id="page-liuyao" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>六爻占卜</h3></div>
      <div id="liuyao-content"></div>
    </section>

    <!-- 八字命理 -->
    <section id="page-bazi" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>八字命理</h3></div>
      <div id="bazi-content"></div>
    </section>

    <!-- 六十四卦 -->
    <section id="page-hexagrams" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>六十四卦</h3></div>
      <div id="hexagrams-content"></div>
    </section>

    <!-- 称骨算命 -->
    <section id="page-chenggu" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>称骨算命</h3></div>
      <div id="chenggu-content"></div>
    </section>

    <!-- 梅花易数 -->
    <section id="page-meihua" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>梅花易数</h3></div>
      <div id="meihua-content"></div>
    </section>

    <!-- 生肖运势 -->
    <section id="page-shengxiao" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>生肖运势</h3></div>
      <div id="shengxiao-content"></div>
    </section>

    <!-- 姓名分析 -->
    <section id="page-naming" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>姓名分析</h3></div>
      <div id="naming-content"></div>
    </section>

    <!-- 塔罗占卜 -->
    <section id="page-tarot" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>塔罗占卜</h3></div>
      <div id="tarot-content"></div>
    </section>

    <!-- 紫微斗数 -->
    <section id="page-ziwei" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>紫微斗数</h3></div>
      <div id="ziwei-content"></div>
    </section>

    <!-- 黄历 -->
    <section id="page-huangli" class="page">
      <div class="page-header"><button class="back-btn">←</button><h3>今日黄历</h3></div>
      <div id="huangli-content"></div>
    </section>
  </main>

  <!-- 底部导航 -->
  <nav id="tab-bar">
    <button class="tab-btn active" data-page="home"><span class="tab-icon">🏠</span><span>首页</span></button>
    <button class="tab-btn" data-page="liuyao"><span class="tab-icon">🪙</span><span>占卜</span></button>
    <button class="tab-btn" data-page="bazi"><span class="tab-icon">☯</span><span>命理</span></button>
    <button class="tab-btn" data-page="hexagrams"><span class="tab-icon">📖</span><span>卦典</span></button>
    <button class="tab-btn" data-page="huangli"><span class="tab-icon">📅</span><span>黄历</span></button>
  </nav>
</div>

<script src="js/data/hexagrams.js"></script>
<script src="js/data/tarot.js"></script>
<script src="js/data/shengxiao.js"></script>
<script type="module" src="js/app.js"></script>

</html>
